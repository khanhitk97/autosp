name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên web

jobs:
  build:
    runs-on: macos-14 # Chạy trên máy ảo macOS của GitHub

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Theos & Toolchain iOS
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # Tải iOS SDK 16.5 / 14.5 cho Theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk $HOME/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Biên dịch Dylib (Compile)
        run: |
          export THEOS=$HOME/theos
          # Build package Theos
          make package FINALPACKAGE=1
          
          # Trích xuất và gom file .dylib vào thư mục output
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/ \;

      - name: Lưu trữ và Tải xuống file Dylib (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: DriverAssistantPro-Dylib
          path: |
            output/*.dylib
            packages/*.deb
